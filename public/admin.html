<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — RAVI</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17171a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body class="admin-body">

<!-- Écran de connexion -->
<div class="login-shell" id="loginShell">
  <form class="card login-card stack" id="loginForm" style="gap:14px">
    <div>
      <div class="wordmark" style="font-size:1.1rem">RAVI</div>
      <h1 style="margin-top:10px;font-size:1.3rem">Espace administration</h1>
      <p class="small muted" style="margin-top:6px">Gestion des commandes, produits et clients.</p>
    </div>
    <div class="field">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" required autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Se connecter</button>
    <p class="small" id="loginError" style="color:var(--bad)"></p>
    <a class="tiny muted center" href="/" style="text-decoration:none">← Retour à la boutique</a>
  </form>
</div>

<!-- Application admin -->
<div id="adminShell" class="hidden">
  <header class="admin-top">
    <span class="wordmark">RAVI</span>
    <span class="tag">Admin</span>
    <span class="spacer"></span>
    <button id="viewShopBtn">Boutique</button>
    <button id="logoutBtn">Quitter</button>
  </header>

  <nav class="tabbar" id="tabbar">
    <button data-tab="resume" class="active"><span class="ic">📊</span>Résumé</button>
    <button data-tab="commandes"><span class="ic">🧾</span>Commandes</button>
    <button data-tab="produits"><span class="ic">📦</span>Produits</button>
    <button data-tab="clients"><span class="ic">👤</span>Clients</button>
    <button data-tab="categories"><span class="ic">🗂️</span>Rayons</button>
    <button data-tab="reglages"><span class="ic">⚙️</span>Réglages</button>
  </nav>

  <main class="admin-main" id="adminMain"></main>
</div>

<div class="toast" id="toast"></div>
<div id="sheetHost"></div>

<script src="/admin.js"></script>
</body>
</html>
