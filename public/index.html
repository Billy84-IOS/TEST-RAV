<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HACKLAB</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='84'>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
</head>
<body>

<!-- Connexion -->
<div class="login-shell" id="loginShell">
  <form class="card login-card" id="loginForm">
    <div class="logo" style="font-size:1.2rem;margin-bottom:6px"><span class="prompt">root@</span>hacklab<span class="cursor"></span></div>
    <p class="muted small" style="margin-bottom:16px">Labo d'entraînement au test d'intrusion.</p>
    <div class="field">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Entrer</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<!-- Application -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="logo"><span class="prompt">root@</span>hacklab<span class="cursor"></span></div>
    <span class="spacer"></span>
    <button id="logoutBtn">Quitter</button>
  </header>

  <main class="wrap" id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="labo" class="active"><span class="ic">🎯</span>Labo</button>
    <button data-tab="terminal"><span class="ic">⌨️</span>Terminal</button>
    <button data-tab="parcours"><span class="ic">🧭</span>Parcours</button>
    <button data-tab="outils"><span class="ic">🧰</span>Outils</button>
    <button data-tab="reglages"><span class="ic">⚙️</span>Réglages</button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
