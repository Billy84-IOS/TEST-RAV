# ==================================================================
#  Labo d'entraînement au pentest — cibles VOLONTAIREMENT vulnérables
# ==================================================================
#  Elles sont liées à 127.0.0.1 uniquement : injoignables depuis
#  l'extérieur du VPS. NE JAMAIS les exposer sur Internet.
# ==================================================================

services:
  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: lab-juiceshop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"

  webgoat:
    image: webgoat/webgoat:latest
    container_name: lab-webgoat
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:8080"

  # API REST volontairement vulnérable (OWASP API Security Top 10)
  vampi:
    image: erev0s/vampi:latest
    container_name: lab-vampi
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:5000"
